task dumpLibs(type: Copy) {
	into layout.buildDirectory.dir('libs/libraries')
	from configurations.packageAll
}

task dumpServerLibs(type: Copy) {
	into layout.buildDirectory.dir('server_dist/libraries')
	from configurations.packageServer
}

task generateStartScripts {
	ext.outDir = layout.buildDirectory.dir('server_dist_scripts').get().asFile
	inputs.property('jarName', { tasks.jar_server.archiveFileName.get() })
	outputs.dir outDir
	doLast {
		outDir.mkdirs()
		String jarName = tasks.jar_server.archiveFileName.get()
		String jvmArgs = '-server -XX:+UseG1GC -XX:+UseStringDeduplication -Xms2G -Xmx4G'
		String sh = '#!/bin/sh\n' +
			'JVM_ARGS="' + jvmArgs + '"\n' +
			'\n' +
			'# This is a Java-8-era server; modern JVMs need reflection opened up.\n' +
			'JAVA_MAJOR=$(java -version 2>&1 | sed -n \'s/.*version "\\([0-9]*\\).*/\\1/p\' | head -n 1)\n' +
			'[ "$JAVA_MAJOR" = "1" ] && JAVA_MAJOR=8\n' +
			'if [ "${JAVA_MAJOR:-8}" -ge 9 ] 2>/dev/null; then\n' +
			'  JVM_ARGS="$JVM_ARGS --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.lang.invoke=ALL-UNNAMED --add-opens java.base/java.lang.reflect=ALL-UNNAMED --add-opens java.base/java.io=ALL-UNNAMED --add-opens java.base/java.net=ALL-UNNAMED --add-opens java.base/java.nio=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED --add-opens java.base/java.util.jar=ALL-UNNAMED --add-opens java.base/java.util.zip=ALL-UNNAMED --add-opens java.base/java.util.concurrent=ALL-UNNAMED --add-opens java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens java.base/java.text=ALL-UNNAMED --add-opens java.base/sun.nio.ch=ALL-UNNAMED --add-opens java.base/jdk.internal.loader=ALL-UNNAMED"\n' +
			'fi\n' +
			'if [ "${JAVA_MAJOR:-8}" -ge 23 ] 2>/dev/null; then\n' +
			'  JVM_ARGS="$JVM_ARGS --sun-misc-unsafe-memory-access=allow"\n' +
			'fi\n' +
			'\n' +
			'exec java $JVM_ARGS -jar ' + jarName + ' "$@"\n'
		new File(outDir, 'start.sh').setText(sh, 'UTF-8')
		String cmd = '@echo off\r\n' +
			'rem On Java 9+ add the --add-opens flags from start.sh to MODERN_JAVA_FLAGS\r\n' +
			'set MODERN_JAVA_FLAGS=\r\n' +
			'java ' + jvmArgs + ' %MODERN_JAVA_FLAGS% -jar ' + jarName + '\r\n' +
			'pause\r\n'
		new File(outDir, 'start.cmd').setText(cmd, 'UTF-8')
	}
}

//Self-contained runnable server: jar + libraries/ (the jar's manifest Class-Path) + start scripts
task serverDist(type: Zip) {
	dependsOn tasks.jar_server, tasks.dumpServerLibs, tasks.generateStartScripts
	archiveClassifier = 'server-dist'
	from tasks.jar_server.archiveFile
	from layout.buildDirectory.dir('server_dist')
	from tasks.generateStartScripts.outDir
}

String getGitDesc() {
	//providers.exec, not project.exec: the latter is gone in Gradle 9.
	return providers.exec {
		commandLine 'git', 'describe', '--tags', '--long'
	}.standardOutput.asText.get().trim()
}

String computeVersion() {
	if(project.hasProperty('override_version'))
		return override_version

	String mmversion; // major.minor
	try {
		String[] parts = getGitDesc().split('-')
		if(parts.length != 3) throw new GradleException('no git tags found')
		if(!parts[0].startsWith('v')) throw new GradleException('last git tag is not a version')
		mmversion = parts[0].substring(1) //removing 'v'
		commit = parts[2].substring(1) //removing 'g'
	} catch (Exception e) {
		if(release_type != 'indev') throw e
		return 'indev'
	}

	if(release_type != 'stable') {
		int ind = mmversion.lastIndexOf('.')
		mmversion = mmversion.substring(0, ind+1) + ((mmversion.substring(ind+1) as int) + 1) + '.0-' + release_type
	}

	if(project.hasProperty('override_revision')) {
		revision = override_revision as int
	} else if(release_type != 'indev' || project.hasProperty('increment_revision')) {
		File verfile = versionFile = layout.buildDirectory.file("versions/$mmversion").get().asFile
		String filetext;
		if(verfile.exists() && !(filetext = verfile.getText().trim()).isEmpty()) {
			String[] fileparts = filetext.split(':')
			if(fileparts.length != 2) throw new GradleException('Version file is corrupted: ' + verfile.getAbsolutePath())
			revision = fileparts[1] as int;
			previousCommit = fileparts[0];
			if(!commit.equals(fileparts[0]) || project.hasProperty('increment_revision')) {
				revision++;
			}
		}
	}

	return (revision > 0 || release_type == 'stable') ? (mmversion+'.'+revision) : mmversion;
}

void doStoreLastRevision() {
	if(versionFile != null) {
		versionFile.getParentFile().mkdirs()
		versionFile.write(commit+':'+revision)
		layout.buildDirectory.file('versions/versions').get().asFile.append(commit+':'+version+'\n');
	}
}

void doGenerateChangelog(File file) {
	BufferedWriter writer = file.newWriter();
	writer.writeLine("Changelog for $name-$version");
	if(previousCommit == null) {
		writer.writeLine('\tempty');
	} else {
		String stdout = providers.exec {
			commandLine 'git', 'log', '--abbrev-commit', '--pretty=short', previousCommit + '..HEAD'
		}.standardOutput.asText.get()
		for(String s : stdout.trim().split('\n')) {
			s = s.trim();
			if(s.isEmpty() || s.startsWith('Author'))
				continue;
			if(s.startsWith('commit'))
				writer.writeLine('\t' + s.substring(7) + ':');
			else
				writer.writeLine('\t\t' + s);
		}
	}
	writer.close();
}
