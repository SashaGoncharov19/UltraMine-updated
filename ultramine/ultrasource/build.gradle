apply plugin: 'java'
apply plugin: 'maven-publish'
apply plugin: 'eclipse'

java {
	//This is a Java 8 codebase and the artifacts must stay Java 8. Stating it as
	//a toolchain rather than only as source/target compatibility means the build
	//can be driven by a newer Gradle daemon later - Gradle 9 requires JDK 17 to
	//run - without silently compiling against a newer JDK's class library.
	toolchain {
		languageVersion = JavaLanguageVersion.of(8)
	}
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

compileJava.options.encoding = 'UTF-8'
if(compile_incremental == "true")
	compileJava.options.incremental = true

ext.commit = null
ext.previousCommit = null
ext.versionFile = null
ext.revision = 0
group = project_group
version = (concat_mc_version_to=='version' ? (minecraft_version+'-') : '') + computeVersion()

repositories {
	mavenCentral()
	maven {
		name = 'minecraft'
		url = 'https://libraries.minecraft.net/'
	}
	maven {
		name = 'forge'
		url = 'https://maven.minecraftforge.net/'
	}
}

configurations {
	compileCommon
	compileClient
	compileServer
	runtimeCommon
	runtimeClient
	runtimeServer
	//`compile` and `runtime` were removed in Gradle 7; these are their successors.
	implementation.extendsFrom compileCommon, compileClient, compileServer
	runtimeOnly.extendsFrom runtimeCommon, runtimeClient, runtimeServer
	packageClient.extendsFrom compileCommon, compileClient, runtimeCommon, runtimeClient
	packageServer.extendsFrom compileCommon, compileServer, runtimeCommon, runtimeServer
	packageAll.extendsFrom compileCommon, compileClient, compileServer, runtimeCommon, runtimeClient, runtimeServer
	//packageClient, packageServer & packageAll is not linking to IDE and must not be used for adding dependencies
}

