name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'If set, also publish a release with this version (no leading v, e.g. 0.1.6)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Manual release path: dispatching this workflow with release_version set
  # runs the full release pipeline (build, smoke test, checksums, provenance
  # attestation, GitHub release + tag) from release.yml on the dispatched ref.
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ inputs.release_version }}
    permissions:
      contents: write
      id-token: write
      attestations: write

  build:
    name: Build (JDK 8, Gradle wrapper)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Verifies gradle/wrapper/gradle-wrapper.jar against Gradle's official
      # checksums — protects against a tampered wrapper binary in the repo.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Compute build version
        id: ver
        run: echo "version=indev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build jars and server distribution
        working-directory: ultramine/ultrasource
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -Poverride_version='${{ steps.ver.outputs.version }}' \
            jar jar_source jar_server jar_client serverDist

      - name: Generate SHA-256 checksums
        working-directory: ultramine/ultrasource/build
        run: |
          : > SHA256SUMS.txt
          (cd libs && sha256sum *.jar) >> SHA256SUMS.txt
          (cd distributions && sha256sum *.zip) >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo '## SHA-256 checksums'
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ultramine_core-${{ steps.ver.outputs.version }}
          if-no-files-found: error
          path: |
            ultramine/ultrasource/build/libs/*.jar
            ultramine/ultrasource/build/distributions/*.zip
            ultramine/ultrasource/build/SHA256SUMS.txt

      # Boots the freshly built server-dist zip and requires it to reach
      # "Done" (fully started), then stops it via console command.
      - name: Boot smoke test
        working-directory: ultramine/ultrasource/build
        run: |
          mkdir -p smoke && cd smoke
          unzip -q ../distributions/*-server-dist.zip
          JAR=$(ls ultramine_core-*-server.jar)
          echo "Booting $JAR on $(java -version 2>&1 | head -1)"
          mkfifo in
          (set +e; java -Xms512M -Xmx2G -jar "$JAR" nogui < in > console.log 2>&1; echo $? > exitcode) &
          exec 9>in
          booted=0
          for i in $(seq 1 90); do
            grep -q 'Done (' console.log 2>/dev/null && { booted=1; break; }
            [ -f exitcode ] && break
            sleep 2
          done
          if [ "$booted" != 1 ]; then
            echo '::error::Server failed to boot (no "Done" within 3 min)'
            tail -c 20000 console.log
            exit 1
          fi
          echo stop >&9
          for i in $(seq 1 30); do [ -f exitcode ] && break; sleep 2; done
          [ -f exitcode ] || { echo '::warning::Server did not stop within 1 min, killing'; pkill -9 -f "$JAR" || true; }
          echo '--- last console lines ---'
          tail -n 40 console.log
          # log4j StatusLogger errors mean the logging config/plugins are broken
          # (server can still reach "Done" with fallback logging) — fail hard.
          if grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2},[0-9]{3} .* (ERROR|FATAL) ' console.log; then
            echo '::error::log4j status errors detected — logging configuration or plugins are broken'
            grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2},[0-9]{3} .* (ERROR|FATAL) ' console.log | head -n 20
            exit 1
          fi

  # Stage 2 acceptance gate: the SAME build must also boot on Java 25.
  # Passing since 510260c — a failure here fails the workflow.
  smoke-java25:
    name: Boot smoke test (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ultramine_core-${{ needs.build.outputs.version }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Boot on Java 25
        run: |
          mkdir -p smoke && cd smoke
          unzip -q ../distributions/*-server-dist.zip
          JAR=$(ls ultramine_core-*-server.jar)
          echo "Booting $JAR on $(java -version 2>&1 | head -1)"
          MODERN_FLAGS="--add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.lang.invoke=ALL-UNNAMED --add-opens java.base/java.lang.reflect=ALL-UNNAMED --add-opens java.base/java.io=ALL-UNNAMED --add-opens java.base/java.net=ALL-UNNAMED --add-opens java.base/java.nio=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED --add-opens java.base/java.util.jar=ALL-UNNAMED --add-opens java.base/java.util.zip=ALL-UNNAMED --add-opens java.base/java.util.concurrent=ALL-UNNAMED --add-opens java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens java.base/java.text=ALL-UNNAMED --add-opens java.base/sun.nio.ch=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow"
          mkfifo in
          (set +e; java -Xms512M -Xmx2G $MODERN_FLAGS -jar "$JAR" nogui < in > console.log 2>&1; echo $? > exitcode) &
          exec 9>in
          booted=0
          for i in $(seq 1 90); do
            grep -q 'Done (' console.log 2>/dev/null && { booted=1; break; }
            [ -f exitcode ] && break
            sleep 2
          done
          if [ "$booted" != 1 ]; then
            echo '::error::Server failed to boot on Java 25'
            echo '--- full console log ---'
            cat console.log
            exit 1
          fi
          echo stop >&9
          for i in $(seq 1 30); do [ -f exitcode ] && break; sleep 2; done
          [ -f exitcode ] || { echo '::warning::Server did not stop within 1 min, killing'; pkill -9 -f "$JAR" || true; }
          echo '--- last console lines ---'
          tail -n 60 console.log
