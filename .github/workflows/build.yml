name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'If set, also publish a release with this version (no leading v, e.g. 0.1.6)'
        required: false
        default: ''
      modpack_url:
        description: 'Modpack boot test: server pack zip URL, or "gtnh-latest" for the newest GTNH daily server pack (variant picked by modpack_java)'
        required: false
        default: ''
      modpack_java:
        description: 'Java version for the modpack boot test'
        required: false
        default: '8'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Manual release path: dispatching this workflow with release_version set
  # runs the full release pipeline (build, smoke test, checksums, provenance
  # attestation, GitHub release + tag) from release.yml on the dispatched ref.
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ inputs.release_version }}
    permissions:
      contents: write
      id-token: write
      attestations: write

  build:
    name: Build (JDK 8, Gradle wrapper)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Verifies gradle/wrapper/gradle-wrapper.jar against Gradle's official
      # checksums — protects against a tampered wrapper binary in the repo.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Compute build version
        id: ver
        run: echo "version=indev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build jars and server distribution
        working-directory: ultramine/ultrasource
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -Poverride_version='${{ steps.ver.outputs.version }}' \
            jar jar_source jar_server jar_client serverDist

      - name: Generate SHA-256 checksums
        working-directory: ultramine/ultrasource/build
        run: |
          : > SHA256SUMS.txt
          (cd libs && sha256sum *.jar) >> SHA256SUMS.txt
          (cd distributions && sha256sum *.zip) >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo '## SHA-256 checksums'
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ultramine_core-${{ steps.ver.outputs.version }}
          if-no-files-found: error
          path: |
            ultramine/ultrasource/build/libs/*.jar
            ultramine/ultrasource/build/distributions/*.zip
            ultramine/ultrasource/build/SHA256SUMS.txt

      # Boots the freshly built server-dist zip and requires it to reach
      # "Done" (fully started), then stops it via console command.
      - name: Boot smoke test
        working-directory: ultramine/ultrasource/build
        run: |
          mkdir -p smoke && cd smoke
          unzip -q ../distributions/*-server-dist.zip
          JAR=$(ls ultramine_core-*-server.jar)
          echo "Booting $JAR on $(java -version 2>&1 | head -1)"
          mkfifo in
          (set +e; java -Xms512M -Xmx2G -jar "$JAR" nogui < in > console.log 2>&1; echo $? > exitcode) &
          exec 9>in
          booted=0
          for i in $(seq 1 90); do
            grep -q 'Done (' console.log 2>/dev/null && { booted=1; break; }
            [ -f exitcode ] && break
            sleep 2
          done
          if [ "$booted" != 1 ]; then
            echo '::error::Server failed to boot (no "Done" within 3 min)'
            tail -c 20000 console.log
            exit 1
          fi
          echo stop >&9
          for i in $(seq 1 30); do [ -f exitcode ] && break; sleep 2; done
          [ -f exitcode ] || { echo '::warning::Server did not stop within 1 min, killing'; pkill -9 -f "$JAR" || true; }
          echo '--- last console lines ---'
          tail -n 40 console.log
          # log4j StatusLogger errors mean the logging config/plugins are broken
          # (server can still reach "Done" with fallback logging) — fail hard.
          if grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2},[0-9]{3} .* (ERROR|FATAL) ' console.log; then
            echo '::error::log4j status errors detected — logging configuration or plugins are broken'
            grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2},[0-9]{3} .* (ERROR|FATAL) ' console.log | head -n 20
            exit 1
          fi

  # Opt-in real-modpack boot test: dispatch the workflow with modpack_url set
  # ("gtnh-latest" resolves the newest GTNH Java 8 server pack). Overlays the
  # pack's mods/config onto our freshly built server-dist and boots it on the
  # requested Java version. The console log is always uploaded as an artifact.
  smoke-modpack:
    name: Modpack boot test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.modpack_url != ''
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ultramine_core-${{ needs.build.outputs.version }}

      - name: Resolve modpack URL
        id: pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL='${{ inputs.modpack_url }}'
          if [ "$URL" = "gtnh-latest" ]; then
            # GTNH publishes daily server packs as GitHub release assets on
            # GTNewHorizons/GTNH-Daily-Builds (the downloads site serves no
            # scrapable listing). Pick the variant for the requested Java.
            if [ "${{ inputs.modpack_java }}" -ge 9 ] 2>/dev/null; then VARIANT=server-java17-26; else VARIANT=server-java8; fi
            # /releases (not /releases/latest) so prerelease-flagged dailies resolve too
            URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              'https://api.github.com/repos/GTNewHorizons/GTNH-Daily-Builds/releases?per_page=10' \
              | jq -r --arg v "$VARIANT.zip" '[.[] | .assets[] | select(.name | endswith($v)) | .browser_download_url] | first // empty')
            [ -n "$URL" ] || { echo "::error::Could not resolve the latest GTNH $VARIANT pack from GTNH-Daily-Builds releases"; exit 1; }
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "key=modpack-$(printf %s "$URL" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "Using pack: $URL"

      - name: Cache modpack zip
        uses: actions/cache@v4
        with:
          path: modpack.zip
          key: ${{ steps.pack.outputs.key }}

      - name: Download modpack
        run: |
          [ -s modpack.zip ] || curl -fL --retry 3 -o modpack.zip '${{ steps.pack.outputs.url }}'
          ls -l modpack.zip

      - name: Set up JDK ${{ inputs.modpack_java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '${{ inputs.modpack_java }}'

      - name: Boot server with modpack
        run: |
          mkdir -p smoke && cd smoke
          unzip -q ../distributions/*-server-dist.zip
          JAR=$(ls ultramine_core-*-server.jar)
          mkdir -p pack && unzip -q ../modpack.zip -d pack
          MODS_DIR=$(find pack -maxdepth 3 -type d -name mods | head -n 1)
          if [ -z "$MODS_DIR" ]; then
            echo '::error::No mods/ directory found in the pack'
            find pack -maxdepth 2 | head -n 30
            exit 1
          fi
          BASE=$(dirname "$MODS_DIR")
          for d in mods config scripts resources; do
            [ -d "$BASE/$d" ] && cp -r "$BASE/$d" . && echo "copied $d"
          done
          # ArchaicFix's Phosphor lighting backport rewrites ExtendedBlockStorage
          # to read and write vanilla's NibbleArray light fields directly. This
          # core keeps chunk light off-heap and has no such fields, so the two
          # lighting implementations cannot coexist - turn Phosphor off.
          if [ -f config/archaicfix.cfg ]; then
            sed -i 's/\(B:enablePhosphor=\)true/\1false/' config/archaicfix.cfg
            echo "archaicfix Phosphor setting: $(grep -n 'enablePhosphor' config/archaicfix.cfg || echo 'key not present')"
          else
            printf 'general {\n    B:enablePhosphor=false\n}\n' > config/archaicfix.cfg
            echo 'archaicfix.cfg not shipped by the pack - wrote one disabling Phosphor'
          fi
          MODERN_FLAGS=""
          if [ "${{ inputs.modpack_java }}" -ge 9 ] 2>/dev/null; then
            MODERN_FLAGS="--add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.lang.invoke=ALL-UNNAMED --add-opens java.base/java.lang.reflect=ALL-UNNAMED --add-opens java.base/java.io=ALL-UNNAMED --add-opens java.base/java.net=ALL-UNNAMED --add-opens java.base/java.nio=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED --add-opens java.base/java.util.jar=ALL-UNNAMED --add-opens java.base/java.util.zip=ALL-UNNAMED --add-opens java.base/java.util.concurrent=ALL-UNNAMED --add-opens java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens java.base/java.text=ALL-UNNAMED --add-opens java.base/sun.nio.ch=ALL-UNNAMED"
          fi
          if [ "${{ inputs.modpack_java }}" -ge 23 ] 2>/dev/null; then
            MODERN_FLAGS="$MODERN_FLAGS --sun-misc-unsafe-memory-access=allow"
          fi
          echo "Booting $JAR with $(ls mods | wc -l) mod files on $(java -version 2>&1 | head -n 1)"
          mkfifo in
          (set +e; java -Xms2G -Xmx6G $MODERN_FLAGS -jar "$JAR" nogui < in > console.log 2>&1; echo $? > exitcode) &
          exec 9>in
          booted=0
          # modded boots are slow - 20 minute budget
          for i in $(seq 1 240); do
            grep -q 'Done (' console.log 2>/dev/null && { booted=1; break; }
            [ -f exitcode ] && break
            sleep 5
          done
          if [ "$booted" != 1 ]; then
            echo '::error::Server failed to boot with the modpack'
            # transform-time load failures are logged once and often swallowed
            # by mods; "was not found" lines are expected side-stripped noise
            echo '--- transform-time class load errors (first 8) ---'
            grep -nE 'Error loading class' console.log | grep -v 'was not found' | head -n 8 || true
            n=$(grep -nE 'Error loading class' console.log | grep -v 'was not found' | head -n 1 | cut -d: -f1)
            if [ -n "$n" ]; then
              echo "--- context of the first one (console line $n) ---"
              start=$((n>10 ? n-10 : 1))
              sed -n "${start},$((n+60))p" console.log
            fi
            # the FIRST initializer failure carries the real cause; the tail
            # usually shows only the secondary "Could not initialize class"
            for pat in 'ExceptionInInitializerError' 'Could not initialize class' 'NoClassDefFoundError' 'LoaderException'; do
              n=$(grep -nFm1 "$pat" console.log | cut -d: -f1)
              if [ -n "$n" ]; then
                echo "--- first '$pat' (console line $n) ---"
                start=$((n>15 ? n-15 : 1))
                sed -n "${start},$((n+150))p" console.log
                break
              fi
            done
            echo '--- last 200 console lines ---'
            tail -n 200 console.log
            for f in crash-reports/*.txt; do [ -f "$f" ] && { echo "--- $f ---"; cat "$f"; }; done
            exit 1
          fi
          echo '=== BOOTED with the modpack ==='
          echo stop >&9
          for i in $(seq 1 60); do [ -f exitcode ] && break; sleep 2; done
          [ -f exitcode ] || { echo '::warning::Server did not stop within 2 min, killing'; pkill -9 -f "$JAR" || true; }
          tail -n 60 console.log

      - name: Upload console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modpack-console-java${{ inputs.modpack_java }}
          path: |
            smoke/console.log
            smoke/crash-reports/
            smoke/logs/
          if-no-files-found: ignore

  # Stage 2 acceptance gate: the SAME build must also boot on Java 25.
  # Passing since 510260c — a failure here fails the workflow.
  smoke-java25:
    name: Boot smoke test (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ultramine_core-${{ needs.build.outputs.version }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Boot on Java 25
        run: |
          mkdir -p smoke && cd smoke
          unzip -q ../distributions/*-server-dist.zip
          JAR=$(ls ultramine_core-*-server.jar)
          echo "Booting $JAR on $(java -version 2>&1 | head -1)"
          MODERN_FLAGS="--add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.lang.invoke=ALL-UNNAMED --add-opens java.base/java.lang.reflect=ALL-UNNAMED --add-opens java.base/java.io=ALL-UNNAMED --add-opens java.base/java.net=ALL-UNNAMED --add-opens java.base/java.nio=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED --add-opens java.base/java.util.jar=ALL-UNNAMED --add-opens java.base/java.util.zip=ALL-UNNAMED --add-opens java.base/java.util.concurrent=ALL-UNNAMED --add-opens java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens java.base/java.text=ALL-UNNAMED --add-opens java.base/sun.nio.ch=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow"
          mkfifo in
          (set +e; java -Xms512M -Xmx2G $MODERN_FLAGS -jar "$JAR" nogui < in > console.log 2>&1; echo $? > exitcode) &
          exec 9>in
          booted=0
          for i in $(seq 1 90); do
            grep -q 'Done (' console.log 2>/dev/null && { booted=1; break; }
            [ -f exitcode ] && break
            sleep 2
          done
          if [ "$booted" != 1 ]; then
            echo '::error::Server failed to boot on Java 25'
            echo '--- full console log ---'
            cat console.log
            exit 1
          fi
          echo stop >&9
          for i in $(seq 1 30); do [ -f exitcode ] && break; sleep 2; done
          [ -f exitcode ] || { echo '::warning::Server did not stop within 1 min, killing'; pkill -9 -f "$JAR" || true; }
          echo '--- last console lines ---'
          tail -n 60 console.log
