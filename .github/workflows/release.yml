name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Compute version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        working-directory: ultramine/ultrasource
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -Poverride_version='${{ steps.ver.outputs.version }}' \
            jar jar_source jar_server jar_client serverDist

      - name: Collect artifacts and generate SHA-256 checksums
        working-directory: ultramine/ultrasource/build
        run: |
          mkdir -p release
          cp libs/*.jar release/
          cp distributions/*.zip release/
          (cd release && sha256sum *.jar *.zip > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      # Signed build provenance: cryptographically links every artifact to this
      # exact commit, workflow and runner. Verifiable by anyone with the gh CLI.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ultramine/ultrasource/build/release/*.jar
            ultramine/ultrasource/build/release/*.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ultramine/ultrasource/build/release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Собрано автоматически на GitHub Actions из тега `${{ github.ref_name }}`
            ([лог сборки](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).
            Никаких вручную загруженных бинарников — всё строится из исходников этого репозитория.

            **`*-server-dist.zip`** — готовый к запуску сервер (jar + `libraries/` + start-скрипты).
            **`*-server.jar`** — только ядро (нужна папка `libraries/` рядом). `*-dev.jar` — MCP-имена, для разработки.

            ### Проверка целостности / Verify integrity

            ```bash
            sha256sum -c SHA256SUMS.txt --ignore-missing
            ```

            ### Проверка происхождения сборки / Verify build provenance

            Каждый файл криптографически привязан к этому коммиту и workflow-запуску
            (GitHub artifact attestations). Проверка через [gh CLI](https://cli.github.com/):

            ```bash
            gh attestation verify <файл> --repo ${{ github.repository }}
            ```

            Подробнее: [docs/07-ci-and-releases.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/docs/07-ci-and-releases.md)
