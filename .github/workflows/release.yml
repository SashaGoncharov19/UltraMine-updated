name: Release

on:
  push:
    tags: ['v*']
  # Manual path: publishes a release from the given ref and creates the
  # v<version> tag on it via GITHUB_TOKEN (for maintainers/agents whose git
  # credentials cannot push tags directly).
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the leading v (e.g. 0.1.6)'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Compute version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release artifacts
        working-directory: ultramine/ultrasource
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -Poverride_version='${{ steps.ver.outputs.version }}' \
            jar jar_source jar_server jar_client serverDist

      # A release must not just compile — it must boot. Same smoke test as CI:
      # start the built server-dist, require "Done", stop via console.
      - name: Boot smoke test
        working-directory: ultramine/ultrasource/build
        run: |
          mkdir -p smoke && cd smoke
          unzip -q ../distributions/*-server-dist.zip
          JAR=$(ls ultramine_core-*-server.jar)
          echo "Booting $JAR on $(java -version 2>&1 | head -1)"
          mkfifo in
          (java -Xms512M -Xmx2G -jar "$JAR" nogui < in > console.log 2>&1; echo $? > exitcode) &
          exec 9>in
          booted=0
          for i in $(seq 1 96); do
            grep -q 'Done (' console.log 2>/dev/null && { booted=1; break; }
            [ -f exitcode ] && break
            sleep 5
          done
          if [ "$booted" != 1 ]; then
            echo '::error::Server failed to boot (no "Done" within 8 min)'
            tail -c 20000 console.log
            exit 1
          fi
          echo stop >&9
          for i in $(seq 1 24); do [ -f exitcode ] && break; sleep 5; done
          [ -f exitcode ] || { echo '::warning::Server did not stop within 2 min, killing'; pkill -9 -f "$JAR" || true; }
          echo '--- last console lines ---'
          tail -n 40 console.log

      - name: Collect artifacts and generate SHA-256 checksums
        working-directory: ultramine/ultrasource/build
        run: |
          mkdir -p release
          cp libs/*.jar release/
          cp distributions/*.zip release/
          (cd release && sha256sum *.jar *.zip > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      # Signed build provenance: cryptographically links every artifact to this
      # exact commit, workflow and runner. Verifiable by anyone with the gh CLI.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ultramine/ultrasource/build/release/*.jar
            ultramine/ultrasource/build/release/*.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: ultramine/ultrasource/build/release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Собрано автоматически на GitHub Actions из тега `v${{ steps.ver.outputs.version }}`
            ([лог сборки](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).
            Никаких вручную загруженных бинарников — всё строится из исходников этого репозитория.

            **`*-server-dist.zip`** — готовый к запуску сервер (jar + `libraries/` + start-скрипты).
            **`*-server.jar`** — только ядро (нужна папка `libraries/` рядом). `*-dev.jar` — MCP-имена, для разработки.

            ### Проверка целостности / Verify integrity

            ```bash
            sha256sum -c SHA256SUMS.txt --ignore-missing
            ```

            ### Проверка происхождения сборки / Verify build provenance

            Каждый файл криптографически привязан к этому коммиту и workflow-запуску
            (GitHub artifact attestations). Проверка через [gh CLI](https://cli.github.com/):

            ```bash
            gh attestation verify <файл> --repo ${{ github.repository }}
            ```

            Подробнее: [docs/07-ci-and-releases.md](${{ github.server_url }}/${{ github.repository }}/blob/v${{ steps.ver.outputs.version }}/docs/07-ci-and-releases.md)
