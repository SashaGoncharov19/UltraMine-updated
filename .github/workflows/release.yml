name: Release

on:
  push:
    tags: ['v*']
  # Manual path: publishes a release from the given ref and creates the
  # v<version> tag on it via GITHUB_TOKEN (for maintainers/agents whose git
  # credentials cannot push tags directly).
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the leading v (e.g. 0.1.6)'
        required: true
  # Callable from other workflows (used by build.yml's release_version input,
  # since a workflow that never ran on the default branch cannot be dispatched
  # by the API directly).
  workflow_call:
    inputs:
      version:
        description: 'Release version without the leading v'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Compute version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release artifacts
        working-directory: ultramine/ultrasource
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -Poverride_version='${{ steps.ver.outputs.version }}' \
            jar jar_source jar_server jar_client serverDist

      # A release must not just compile — it must boot. Same smoke test as CI:
      # start the built server-dist, require "Done", stop via console.
      - name: Boot smoke test
        working-directory: ultramine/ultrasource/build
        run: |
          mkdir -p smoke && cd smoke
          unzip -q ../distributions/*-server-dist.zip
          JAR=$(ls ultramine_core-*-server.jar)
          echo "Booting $JAR on $(java -version 2>&1 | head -1)"
          mkfifo in
          (set +e; java -Xms512M -Xmx2G -jar "$JAR" nogui < in > console.log 2>&1; echo $? > exitcode) &
          exec 9>in
          booted=0
          for i in $(seq 1 90); do
            grep -q 'Done (' console.log 2>/dev/null && { booted=1; break; }
            [ -f exitcode ] && break
            sleep 2
          done
          if [ "$booted" != 1 ]; then
            echo '::error::Server failed to boot (no "Done" within 3 min)'
            tail -c 20000 console.log
            exit 1
          fi
          echo stop >&9
          for i in $(seq 1 30); do [ -f exitcode ] && break; sleep 2; done
          [ -f exitcode ] || { echo '::warning::Server did not stop within 1 min, killing'; pkill -9 -f "$JAR" || true; }
          echo '--- last console lines ---'
          tail -n 40 console.log
          # log4j StatusLogger errors mean the logging config/plugins are broken
          # (server can still reach "Done" with fallback logging) — fail hard.
          if grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2},[0-9]{3} .* (ERROR|FATAL) ' console.log; then
            echo '::error::log4j status errors detected — logging configuration or plugins are broken'
            grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2},[0-9]{3} .* (ERROR|FATAL) ' console.log | head -n 20
            exit 1
          fi

      - name: Collect artifacts and generate SHA-256 checksums
        working-directory: ultramine/ultrasource/build
        run: |
          mkdir -p release
          cp libs/*.jar release/
          cp distributions/*.zip release/
          (cd release && sha256sum *.jar *.zip > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      # Signed build provenance: cryptographically links every artifact to this
      # exact commit, workflow and runner. Verifiable by anyone with the gh CLI.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ultramine/ultrasource/build/release/*.jar
            ultramine/ultrasource/build/release/*.zip

      # Release body = docs/release-notes/v<version>.md (when the file exists —
      # human-written "what's in this update") + the standard verification section.
      - name: Compose release body
        run: |
          BODY=ultramine/ultrasource/build/release_body.md
          NOTES='docs/release-notes/v${{ steps.ver.outputs.version }}.md'
          : > "$BODY"
          if [ -f "$NOTES" ]; then
            cat "$NOTES" >> "$BODY"
            echo >> "$BODY"
          fi
          cat >> "$BODY" <<'EOF'
          ---

          Built automatically by GitHub Actions from tag `v${{ steps.ver.outputs.version }}`
          ([build log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).
          No hand-uploaded binaries — everything is built from this repository's sources.

          **`*-server-dist.zip`** — ready-to-run server (jar + `libraries/` + start scripts).
          **`*-server.jar`** — the core alone (needs the `libraries/` folder next to it). `*-dev.jar` — MCP names, for development.

          ### Verify integrity

          ```bash
          sha256sum -c SHA256SUMS.txt --ignore-missing
          ```

          ### Verify build provenance

          Every file is cryptographically bound to this commit and workflow run
          (GitHub artifact attestations). Verify with the [gh CLI](https://cli.github.com/):

          ```bash
          gh attestation verify <file> --repo ${{ github.repository }}
          ```

          Details: [docs/07-ci-and-releases.md](${{ github.server_url }}/${{ github.repository }}/blob/v${{ steps.ver.outputs.version }}/docs/07-ci-and-releases.md)
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: ultramine/ultrasource/build/release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: ultramine/ultrasource/build/release_body.md
