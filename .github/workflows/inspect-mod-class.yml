name: Inspect a mod class

# Reads a single class out of a modpack's jar and prints its constant pool.
#
# Exists because the interesting questions about coremod compatibility are
# questions about bytecode as shipped, and the answer is one javap away - but
# the pack is half a gigabyte and only a runner has the network for it.
#
# First use: issue #22, whether tc4tweak ships a malformed method reference or
# whether some transformer breaks it in flight.

on:
  workflow_dispatch:
    inputs:
      pack_url:
        description: "Server pack zip to read from"
        required: true
        default: "https://downloads.gtnewhorizons.com/ServerPacks/GT_New_Horizons_2.8.4_Server_Java_8.zip"
      jar_glob:
        description: "Which jar inside the pack (glob, matched anywhere in the path)"
        required: true
        default: "*tc4tweak*.jar"
      class_path:
        description: "Class inside that jar"
        required: true
        default: "net/glease/tc4tweak/api/InfusionExtAPI$RecipeNBTBehavior.class"
      grep:
        description: "Extra term to pull out of the javap output (optional)"
        required: false
        default: "lambda$mergeNBT$1"

permissions:
  contents: read

jobs:
  inspect:
    name: javap
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Fetch the pack and pull out one jar
        env:
          PACK_URL: ${{ inputs.pack_url }}
          JAR_GLOB: ${{ inputs.jar_glob }}
        run: |
          curl -fL --retry 3 -o pack.zip "$PACK_URL"
          ls -l pack.zip
          # The pack nests its mods directory, so the glob is matched against the
          # whole path rather than anchored at the root. -j flattens the result.
          if ! unzip -j -o pack.zip "$JAR_GLOB" -d jar; then
            echo "::error::No entry matched $JAR_GLOB"
            echo '--- entries whose name resembles it ---'
            unzip -l pack.zip | grep -iF "$(basename "$JAR_GLOB" .jar | tr -d '*')" | head -20 || true
            echo '--- directories one and two levels in ---'
            unzip -l pack.zip | awk '{print $4}' | grep -oE '^[^/]+/([^/]+/)?' | sort -u | head -20
            exit 1
          fi
          rm -f pack.zip
          ls -l jar/

      # Every input is read from the environment rather than interpolated into
      # the script. Inner-class names carry a `$`, and inside a double-quoted
      # interpolation bash expanded `$RecipeNBTBehavior` to nothing - the step
      # then looked for the wrong file and reported the class missing when it
      # was there.
      - name: Read the class
        env:
          JAR_GLOB: ${{ inputs.jar_glob }}
          CLASS_PATH: ${{ inputs.class_path }}
          GREP_TERM: ${{ inputs.grep }}
        run: |
          JAR=$(ls jar/*.jar | head -n 1)
          [ -n "$JAR" ] || { echo "::error::No jar matched $JAR_GLOB"; exit 1; }
          echo "jar: $JAR"
          mkdir -p out
          unzip -o "$JAR" "$CLASS_PATH" -d out
          CLASS="out/$CLASS_PATH"
          if [ ! -f "$CLASS" ]; then
            echo "::error::$CLASS_PATH is not in that jar"
            echo '--- classes in the same package ---'
            unzip -l "$JAR" | grep -F "$(dirname "$CLASS_PATH")/" | head -40
            exit 1
          fi

          echo '=============== class file, as shipped ==============='
          javap -v -p "$CLASS" > javap.txt
          sed -n '1,25p' javap.txt

          echo
          echo '=============== constant pool ==============='
          sed -n '/Constant pool:/,/^{/p' javap.txt | head -80

          if [ -n "$GREP_TERM" ]; then
            echo
            echo "=============== every mention of $GREP_TERM ==============="
            grep -n -F -- "$GREP_TERM" javap.txt || echo '(not found)'
          fi

          # `Methodref` is a substring of `InterfaceMethodref`, so the tally has
          # to anchor on the `=` javap puts before the tag or it counts both.
          echo
          echo '=============== Methodref vs InterfaceMethodref tally ==============='
          echo "Methodref:          $(grep -c '= Methodref' javap.txt || true)"
          echo "InterfaceMethodref: $(grep -c '= InterfaceMethodref' javap.txt || true)"

      - name: Upload the full javap output
        uses: actions/upload-artifact@v4
        with:
          name: javap
          path: javap.txt
