name: Inspect a mod class

# Reads a single class out of a modpack's jar and prints its constant pool.
#
# Exists because the interesting questions about coremod compatibility are
# questions about bytecode as shipped, and the answer is one javap away - but
# the pack is half a gigabyte and only a runner has the network for it.
#
# First use: issue #22, whether tc4tweak ships a malformed method reference or
# whether some transformer breaks it in flight.

on:
  workflow_dispatch:
    inputs:
      pack_url:
        description: "Server pack zip to read from"
        required: true
        default: "https://downloads.gtnewhorizons.com/ServerPacks/GT_New_Horizons_2.8.4_Server_Java_8.zip"
      jar_glob:
        description: "Which jars to search (glob over the pack; the class decides which one is read)"
        required: true
        default: "*.jar"
      class_path:
        description: "Class inside that jar"
        required: true
        default: "net/glease/tc4tweak/api/InfusionExtAPI$RecipeNBTBehavior.class"
      grep:
        description: "Extra term to pull out of the javap output (optional)"
        required: false
        default: "lambda$mergeNBT$1"

permissions:
  contents: read

jobs:
  inspect:
    name: javap
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Fetch the pack
        env:
          PACK_URL: ${{ inputs.pack_url }}
        run: |
          curl -fL --retry 3 -o pack.zip "$PACK_URL"
          ls -l pack.zip

      # The jar's name is not something we reliably know - a mod's file name
      # rarely matches its package. The first attempt guessed `*tc4tweak*.jar`
      # and no entry in the pack carried that string at all. So the class is the
      # search key, and the jar it lives in is an output rather than an input.
      - name: Find the jar that contains the class
        env:
          JAR_GLOB: ${{ inputs.jar_glob }}
          CLASS_PATH: ${{ inputs.class_path }}
        run: |
          mkdir -p pack
          unzip -q -o pack.zip "$JAR_GLOB" -d pack
          rm -f pack.zip
          COUNT=$(find pack -name '*.jar' | wc -l)
          echo "jars in pack matching $JAR_GLOB: $COUNT"
          [ "$COUNT" -gt 0 ] || { echo "::error::No jars matched $JAR_GLOB"; exit 1; }

          : > hits.txt
          while IFS= read -r j; do
            if unzip -l "$j" 2>/dev/null | grep -qF "$CLASS_PATH"; then
              echo "$j" >> hits.txt
            fi
          done < <(find pack -name '*.jar')

          if [ ! -s hits.txt ]; then
            echo "::error::No jar in the pack contains $CLASS_PATH"
            echo '--- jars whose name resembles the package ---'
            PKG=$(echo "$CLASS_PATH" | awk -F/ '{print $(NF-2)}')
            find pack -iname "*${PKG}*" | head -20 || true
            echo "(searched $COUNT jars)"
            exit 1
          fi

          echo '--- jars containing it ---'
          cat hits.txt
          head -n 1 hits.txt > jar.txt

      - name: Read the class
        env:
          CLASS_PATH: ${{ inputs.class_path }}
          GREP_TERM: ${{ inputs.grep }}
        run: |
          JAR=$(cat jar.txt)
          echo "jar: $JAR"
          mkdir -p out
          unzip -o "$JAR" "$CLASS_PATH" -d out
          CLASS="out/$CLASS_PATH"
          [ -f "$CLASS" ] || { echo "::error::extraction of $CLASS_PATH failed"; exit 1; }

          echo '=============== class file, as shipped ==============='
          javap -v -p "$CLASS" > javap.txt
          sed -n '1,25p' javap.txt

          echo
          echo '=============== constant pool ==============='
          sed -n '/Constant pool:/,/^{/p' javap.txt | head -80

          if [ -n "$GREP_TERM" ]; then
            echo
            echo "=============== every mention of $GREP_TERM ==============="
            grep -n -F -- "$GREP_TERM" javap.txt || echo '(not found)'
          fi

          # `Methodref` is a substring of `InterfaceMethodref`, so the tally has
          # to anchor on the `=` javap puts before the tag or it counts both.
          echo
          echo '=============== Methodref vs InterfaceMethodref tally ==============='
          echo "Methodref:          $(grep -c '= Methodref' javap.txt || true)"
          echo "InterfaceMethodref: $(grep -c '= InterfaceMethodref' javap.txt || true)"

      - name: Upload the full javap output
        uses: actions/upload-artifact@v4
        with:
          name: javap
          path: javap.txt
