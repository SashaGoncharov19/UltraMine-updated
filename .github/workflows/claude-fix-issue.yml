name: Claude · fix an issue

# Puts Claude on a single issue: it plans in the open, implements on a branch,
# runs the same gates a person would, and opens a pull request. It never merges -
# that decision stays with a human, always.
#
# Two ways in:
#   - add the label `claude:fix` to an issue
#   - run this workflow manually with an issue number
#
# Requires one of these repository secrets:
#   CLAUDE_CODE_OAUTH_TOKEN  (preferred - `claude setup-token` in the CLI)
#   ANTHROPIC_API_KEY

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to work on"
        required: true
        type: string
      extra:
        description: "Anything to tell Claude beyond the issue itself (optional)"
        required: false
        type: string
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

# One run per issue. A second request waits rather than racing the first over the
# same branch.
concurrency:
  group: claude-fix-${{ inputs.issue || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix:
    name: Plan, implement, open a PR
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'claude:fix'
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      # The build needs a Java 8 toolchain, so give Claude one it can actually run
      # the gates with. A PR opened without ./gradlew test having passed is worth
      # less than no PR.
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      # Without a credential the action fails somewhere inside itself, which reads
      # like a broken workflow rather than a missing setup step. Say it plainly.
      - name: Check credentials are present
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ] || [ -n "$APIKEY" ]; then
            echo "Credential present."
            exit 0
          fi
          echo '::error::No Claude credential configured. Add one repository secret:'
          echo '::error::  CLAUDE_CODE_OAUTH_TOKEN - from `claude setup-token`, bills against the Claude subscription'
          echo '::error::  ANTHROPIC_API_KEY       - from console.anthropic.com, bills API usage'
          echo '::error::Settings -> Secrets and variables -> Actions -> New repository secret'
          exit 1

      - name: Note when the run started
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Work the issue
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          base_branch: dev
          branch_prefix: claude/issue-
          # Progress-tracking comments need an issue or PR to attach to, so they
          # are only available on the label path. On a manual dispatch there is no
          # such context and the action refuses to start at all.
          track_progress: ${{ github.event_name != 'workflow_dispatch' }}
          additional_permissions: |
            actions: read
          # Without an explicit tool list the run has no Bash, so it can neither
          # run the build nor use gh - the first attempt finished in 24 seconds
          # having done nothing, and still reported success.
          claude_args: |
            --max-turns 150
            --allowed-tools Bash,Read,Write,Edit,Glob,Grep
          # A run whose work cannot be inspected is not verifiable, which is the
          # whole point of this workflow.
          show_full_output: true
          prompt: |
            Work issue #${{ inputs.issue || github.event.issue.number }} in this
            repository, end to end, and open a pull request for it.

            Read CLAUDE.md first. It carries this project's build commands, its CI
            gates, and the rules that exist because ignoring them produced wrong
            claims here before. Those rules bind you exactly as they bind a person.

            ${{ inputs.extra }}

            ## Plan before you touch code

            Post a comment on the issue with your plan, before the first edit -
            `gh issue comment <n> --body ...`, and check it succeeded. It has to be
            checkable by someone who has not read the code:

            - what you believe the cause is, and the file and line that shows it
            - what you intend to change, and what you deliberately will not
            - how you will know it worked - the command, the gate, the log line
            - what you are unsure about

            If the issue turns out to be wrong, or the cause is somewhere else,
            say so in that comment and stop. A corrected diagnosis is a good
            outcome. Guessing to produce a diff is not.

            ## Then implement

            Smallest change that fixes the issue. Do not widen the scope, do not
            reformat untouched code, do not fix unrelated things you notice - open
            a new issue for those instead.

            Anything touching a vanilla Minecraft or Forge class goes through the
            shape rule in CLAUDE.md first. That rule has cost this project more
            boot failures than anything else.

            ## Verify before you open anything

            Run the real gates, from `ultramine/ultrasource`:

                ./gradlew test
                ./gradlew jar_server serverDist

            Both must pass. Add a test when the bug is testable - a fix with no
            test is held in place by nothing. If you cannot verify something, the
            pull request has to say so plainly rather than implying it was checked.

            The modpack boot test is not available to you here; it is dispatched
            manually. If your change could affect a modded boot, say so in the PR
            and name which gate should be run before merge.

            ## The pull request

            Push your branch and open it with `gh pr create --base dev`.
            English, like everything else in this repository. Title says what
            changed, not which issue it closes. Body covers:

            - the symptom, and the cause you actually found
            - what you changed and why that is the right place for it
            - what you verified, with the output that shows it
            - what you did not verify, and what remains open
            - `Fixes #<n>`

            Do not describe the change as more certain than your evidence is.

            ## Where you stop

            Open the pull request and stop. Never merge it, never enable
            auto-merge, never push to `dev` or `master`. Merging is the
            maintainer's decision and it is not delegated to you.

        env:
          # gh is how the plan comment and the pull request get posted.
          GH_TOKEN: ${{ github.token }}

      # Two separate claims, because a green run has twice told us nothing.
      #
      # The first three runs reported success having done nothing at all: the
      # prompt was written under `env:` instead of `with:`, so the action found
      # no trigger and skipped itself in under two seconds.
      #
      # Then a run that genuinely executed still left no comment, no branch and
      # no pull request - and passed, because the action's own conclusion was
      # `success`. A conclusion is evidence that Claude ran, not that it did
      # anything. The prompt requires a plan comment before the first edit, so
      # the absence of one means the run did not do the job whatever it spent
      # its turns on.
      - name: Assert the run actually did something
        if: always() && steps.claude.outcome != 'skipped'
        env:
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          SINCE: ${{ steps.started.outputs.at }}
        run: |
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Claude did not run. conclusion='${CONCLUSION:-<empty>}'"
            echo "::error::An empty conclusion means the action skipped itself before"
            echo "::error::starting - most often a missing or misplaced prompt input."
            echo "::error::Read the 'Run Claude Code Action' step: 'Context prompt' and"
            echo "::error::'Trigger result' say which."
            exit 1
          fi

          POSTED=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments" --paginate \
            --jq "[.[] | select(.user.login == \"claude[bot]\") | select(.created_at >= \"${SINCE}\")] | length")
          echo "comments posted by claude[bot] since ${SINCE}: ${POSTED:-0}"
          if [ "${POSTED:-0}" -lt 1 ]; then
            echo "::error::Claude ran but left nothing on issue #${ISSUE}."
            echo "::error::The prompt requires a plan comment before the first edit, so a"
            echo "::error::run with no comment did not do the job - most often it spent its"
            echo "::error::turns exploring and hit --max-turns before reporting anything."
            echo "::error::Read the 'Work the issue' step output above to see where it stopped."
            exit 1
          fi
          echo "Claude ran and reported on the issue."
