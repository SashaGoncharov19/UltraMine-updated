name: Claude · address a review

# Closes the loop. The issue workflow opens a pull request, the review workflow
# judges it, and this one answers what the review asked for - so a request for
# changes does not sit there waiting for a person to relay it.
#
# Two ways in:
#   - automatically, when a review requests changes on a pull request Claude
#     opened
#   - manually, with a pull request number, for anything else
#
# It pushes to the pull request's own branch. It never merges.

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to work on"
        required: true
        type: string
      extra:
        description: "Anything to tell Claude beyond the review (optional)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: read
  id-token: write

# One at a time per pull request; a second review waits rather than racing the
# first over the same branch.
concurrency:
  group: claude-address-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  address:
    name: Answer the review
    # Only automatic on pull requests Claude opened. A human's pull request is
    # theirs to change; dispatch this by hand if you want Claude on one.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.review.state == 'changes_requested' &&
       github.event.pull_request.user.login == 'claude[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" \
            --jq '"number=\(.number)\nbranch=\(.head.ref)\nsha=\(.head.sha)\nauthor=\(.user.login)\nstate=\(.state)"' \
            >> "$GITHUB_OUTPUT"

      # A loop that cannot end is worse than one that never starts. Claude gets
      # a bounded number of attempts at a pull request; after that it says what
      # is still wrong and leaves it to a person, which is the honest outcome
      # when repeated attempts have not converged.
      - name: Check the attempt budget
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          MAX=4
          USED=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/commits" --paginate \
            --jq '[.[] | select(.author.login == "claude[bot]" or .commit.author.name == "claude[bot]")] | length')
          echo "attempts used: ${USED:-0} of $MAX"
          echo "used=${USED:-0}" >> "$GITHUB_OUTPUT"
          if [ "${USED:-0}" -ge "$MAX" ]; then
            echo "over=true" >> "$GITHUB_OUTPUT"
          else
            echo "over=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop and hand over
        if: steps.budget.outputs.over == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          USED: ${{ steps.budget.outputs.used }}
        run: |
          {
            printf 'Stopping here rather than trying again.\n\n'
            printf 'This pull request has already had %s rounds of automated changes and\n' "$USED"
            printf 'the review still asks for more. Past that point another attempt is more\n'
            printf 'likely to churn than to converge, and a person should look at whether the\n'
            printf 'approach is right rather than whether the patch is.\n\n'
            printf 'Nothing has been reverted; the branch is where the last round left it.\n\n'
            printf -- '---\n'
            printf '_Generated by [Claude Code](https://claude.ai/code)_\n'
          } > handover.md
          gh pr comment "$PR" --body-file handover.md
          echo "::notice::Attempt budget spent (${USED} rounds); handed to a human."

      - name: Checkout the pull request branch
        if: steps.budget.outputs.over != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0

      - name: Set up JDK 8
        if: steps.budget.outputs.over != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Check credentials are present
        if: steps.budget.outputs.over != 'true'
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ] || [ -n "$APIKEY" ]; then exit 0; fi
          echo '::error::No Claude credential configured (CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY).'
          exit 1

      - name: Note when the run started
        if: steps.budget.outputs.over != 'true'
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Address the review
        if: steps.budget.outputs.over != 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: ${{ github.event_name != 'workflow_dispatch' }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 150
            --allowed-tools Bash,Read,Write,Edit,Glob,Grep
          show_full_output: true
          allowed_bots: "claude[bot]"
          prompt: |
            Pull request #${{ steps.pr.outputs.number }} has a review asking for
            changes. Answer it on branch `${{ steps.pr.outputs.branch }}`, which
            is already checked out.

            Read CLAUDE.md first.

            ${{ inputs.extra }}

            ## Read the review before touching anything

            `gh pr view ${{ steps.pr.outputs.number }} --comments` and
            `gh api repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }}/comments`
            give you the summary review and the inline comments. Read every point.

            ## Then decide, point by point

            Every point gets one of three answers, and none of them is silence:

            - **Fix it.** The reviewer is right. Make the change.
            - **Disagree, with evidence.** The reviewer is wrong, and you can show
              it - the code says otherwise, the test proves otherwise, the claim
              rests on a version or a file that is not what the reviewer thought.
              Say so plainly and do not change the code. A reviewer being wrong is
              a normal outcome and agreeing anyway is worse than arguing.
            - **Out of scope.** It is a real point but a different change. Open an
              issue for it and link that issue in your reply.

            Do not widen the pull request to satisfy a reviewer. If the review
            asks for something that changes what this pull request is, say that,
            and propose the split.

            ## Verify before you push

            From `ultramine/ultrasource`:

                ./gradlew test
                ./gradlew jar_server serverDist

            Both must pass. If a fix is testable, the test comes with it - and it
            must be a test that would fail if the fix were reverted. If it would
            pass either way, it is holding nothing in place and you should say so
            rather than count it.

            The modpack boot test is not available to you here. If your change
            could affect a modded boot, say which gate should run before merge.

            ## Push, then reply

            Commit to `${{ steps.pr.outputs.branch }}` and push. Then post one
            comment on the pull request covering, for every point in the review:
            what you changed, what you declined and why, and what you moved to a
            new issue. Quote the reviewer's point so the reply reads on its own.

            Say what you could not verify. Do not describe a change as more
            certain than your evidence is.

            ## Where you stop

            Push and reply, and stop. Never merge, never enable auto-merge, never
            push to `dev` or `master`, and never resolve or dismiss the review
            yourself - the reviewer and the maintainer decide whether the answer
            was good enough.
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Assert the round did something
        if: always() && steps.budget.outputs.over != 'true' && steps.claude.outcome != 'skipped'
        env:
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          SINCE: ${{ steps.started.outputs.at }}
          BEFORE: ${{ steps.pr.outputs.sha }}
        run: |
          TOUCHES_WORKFLOWS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate \
            --jq '[.[] | select(.filename | startswith(".github/workflows/"))] | length')
          if [ "$CONCLUSION" != "success" ] && [ "${TOUCHES_WORKFLOWS:-0}" -gt 0 ]; then
            echo "::notice::Not addressed: this pull request edits workflow files, which the"
            echo "::notice::action declines to run against. Handle this one by hand."
            exit 0
          fi
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Claude did not run. conclusion='${CONCLUSION:-<empty>}'"
            exit 1
          fi

          # Either a push or a reply is a real outcome. Neither is not: the
          # prompt requires an answer to every point, so silence means the round
          # did not happen whatever it spent its turns on.
          AFTER=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.head.sha')
          COMMENTS=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq "[.[] | select(.user.login == \"claude[bot]\") | select(.created_at >= \"${SINCE}\")] | length")
          echo "head before=${BEFORE} after=${AFTER} | replies=${COMMENTS:-0}"
          if [ "$AFTER" = "$BEFORE" ] && [ "${COMMENTS:-0}" -lt 1 ]; then
            echo "::error::Claude ran but neither pushed nor replied on #${PR}."
            echo "::error::Read the 'Address the review' step output to see where it stopped."
            exit 1
          fi
          echo "Round complete."
