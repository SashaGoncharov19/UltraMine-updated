name: Claude · review a pull request

# A second pair of eyes before merge. It reviews and reports; it never approves
# and never merges - that decision stays with a person.
#
# Three ways in:
#   - automatically, when a pull request is opened or pushed to
#   - add the label `claude:review` to a pull request
#   - run this workflow manually with a pull request number
#
# Requires CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY in repository secrets.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to review"
        required: true
        type: string
      extra:
        description: "Anything to tell Claude beyond the diff (optional)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: read
  actions: read
  id-token: write

# A new push supersedes a review of the old diff rather than queueing behind it.
concurrency:
  group: claude-review-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review the diff
    # `labeled` fires for every label, so only act on ours; the other event
    # types are always meant for us.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'claude:review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The reviewer is asked to run the fast gates itself rather than trust the
      # author's word, so it needs the toolchain the project actually builds on.
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Check credentials are present
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ] || [ -n "$APIKEY" ]; then
            echo "Credential present."
            exit 0
          fi
          echo '::error::No Claude credential configured. Add one repository secret:'
          echo '::error::  CLAUDE_CODE_OAUTH_TOKEN - from `claude setup-token`'
          echo '::error::  ANTHROPIC_API_KEY       - from console.anthropic.com'
          exit 1

      - name: Note when the run started
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Progress-tracking comments need an event that carries a PR to attach
          # to; a manual dispatch has none and the action refuses to start.
          track_progress: ${{ github.event_name != 'workflow_dispatch' }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 150
            --allowed-tools Bash,Read,Write,Edit,Glob,Grep
          show_full_output: true
          prompt: |
            Review pull request #${{ inputs.pr || github.event.pull_request.number }}
            in this repository, and post the review. Do not approve it and do not
            merge it - that decision belongs to a person.

            Read CLAUDE.md first. It carries this project's rules, and they exist
            because ignoring them produced real failures here.

            ${{ inputs.extra }}

            ## What this repository actually breaks on

            Check these before anything a generic reviewer would look for. Every
            one of them has cost this project a broken modpack.

            1. **Vanilla shape.** This core is Minecraft, Forge and FML compiled
               as one tree, and coremods patch those classes by name. If the diff
               renames a field, changes a field's type, removes a local, moves an
               allocation, or replaces one call with a different call in a vanilla
               class, some coremod almost certainly patches exactly that, and
               Mixin fails the whole mixin when a @Shadow or injection point does
               not resolve. Say so, and name the vanilla shape that was lost.
            2. **Ordinal-sensitive rewrites.** Coremods @Redirect by ordinal. If
               the diff reorders calls inside a vanilla method, the ordinals moved.
            3. **Java 8 and modern JVMs both.** This core runs on 8 through 25.
               A new dependency must be Java 8 bytecode (check the class file
               major version, do not assume); reflection that strips FINAL or
               reads Field.modifiers is blocked from Java 12; sun.reflect and the
               Java EE modules are gone from Java 11 on.
            4. **Mod-facing library bumps.** guava, commons-lang3, jopt-simple,
               netty and friends are compiled against by every mod in the
               ecosystem. A bump needs the release-pack boot test, not a unit test.
            5. **Tripwires in public vanilla methods.** Throwing from one on the
               assumption that only this core calls it has already cost a
               repository its world saves.

            ## Then the claims

            A pull request body is a claim, and this project has had several that
            were not true. For each one:

            - Does "verified" correspond to something actually run, with output?
            - Is a grep being passed off as proof? A class name appearing in a
              file says nothing about whether a fix is present.
            - Does an optimisation claim have a before and after from the same
              harness? Without one it is not a fix.
            - Would the added test fail if the fix were reverted? A test that
              passes either way is not holding anything in place. Say so plainly
              when you find one.
            - Is anything described as more certain than its evidence?

            ## Run the fast gates yourself

            From `ultramine/ultrasource`, on the PR's head:

                ./gradlew test

            Do not take the author's word for it. If it fails, that is the
            finding. If you cannot run it, say that instead of implying you did.

            ## Conventions

            English everywhere. No model identifiers in anything committed.
            Comments should explain *why*, and deliberate divergences from
            vanilla are marked `ultramine:`.

            ## How to report

            Post one review with `gh pr review <n> --comment --body-file <file>`.
            Use inline comments for specific lines where you can.

            Lead with the verdict in one line: whether you found anything that
            should block a merge. Then the findings, most serious first, each
            with the file and line and why it matters *here*. Then, explicitly,
            what you checked and found clean - a reviewer who lists only problems
            leaves the reader unable to tell thoroughness from silence.

            Say what you could not check. "Not verified" is a finished answer.

            Do not invent findings to look useful. A short review saying the
            change is small, correct and well-evidenced is a good review. Do not
            restate the diff back at the author, and do not raise style
            preferences the repository has not adopted.
        env:
          GH_TOKEN: ${{ github.token }}

      # A conclusion of `success` means Claude ran, not that it reviewed
      # anything - a run on issue #20 finished green having posted nothing at
      # all. Require the review to actually exist.
      - name: Assert a review was posted
        if: always() && steps.claude.outcome != 'skipped'
        env:
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          SINCE: ${{ steps.started.outputs.at }}
        run: |
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Claude did not run. conclusion='${CONCLUSION:-<empty>}'"
            echo "::error::An empty conclusion means the action skipped itself before"
            echo "::error::starting - most often a missing or misplaced prompt input."
            exit 1
          fi

          REVIEWS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews" --paginate \
            --jq "[.[] | select(.user.login == \"claude[bot]\") | select(.submitted_at >= \"${SINCE}\")] | length")
          COMMENTS=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq "[.[] | select(.user.login == \"claude[bot]\") | select(.created_at >= \"${SINCE}\")] | length")
          echo "reviews=${REVIEWS:-0} comments=${COMMENTS:-0} since ${SINCE}"
          if [ $(( ${REVIEWS:-0} + ${COMMENTS:-0} )) -lt 1 ]; then
            echo "::error::Claude ran but posted no review on #${PR}."
            echo "::error::Read the 'Review' step output above to see where it stopped;"
            echo "::error::a run that explores and hits --max-turns looks exactly like this."
            exit 1
          fi
          echo "Review posted."
